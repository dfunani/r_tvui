name: RTVUI-Deployment-Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Check
      run: make check
  fmt:
    runs-on: ubuntu-latest
    needs: [check]

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Format
      run: make fmt
  
  lint:
    runs-on: ubuntu-latest
    needs: [check, fmt]

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Lint
      run: make lint
  
  clean:
    runs-on: ubuntu-latest
    needs: [check, fmt, lint]

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Clean
      run: make clean
  
  test:
    runs-on: ubuntu-latest
    needs: [check, fmt, lint, clean]

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Test
      run: make test
  
  build:
    runs-on: ubuntu-latest
    needs: [check, fmt, lint, clean, test]

    steps:
    - uses: actions/checkout@v5
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Build
      run: make build
